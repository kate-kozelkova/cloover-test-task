# Allowlists and thresholds for the automated PR review pipeline.
# Editing this file is itself a change that should route to a human
# (it's how the safety net could be weakened) - see the README's tradeoffs
# section for the self-modification gap this leaves open.

allowlisted_dependencies:
  - requests
  - flask
  - python-dotenv
  - pyyaml
  - pandas

allowlisted_egress_hosts:
  - hooks.slack.com
  - api.slack.com
  - slack.com

# Any finding at all routes to a human - the only way to auto-merge is a
# clean pass with a confident review. This threshold controls that second
# half: even with zero findings, low reviewer confidence still routes to
# a human rather than merging on an unsure "looks fine".
llm_min_confidence_for_auto: 0.85
