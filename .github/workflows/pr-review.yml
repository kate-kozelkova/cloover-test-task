name: PR data-safety review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for a base...head diff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install review pipeline deps
        run: pip install -r review/requirements.txt

      - name: Run automated review
        working-directory: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py --action
